<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      G00474316
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- search bar and button -->
  <ion-input label="Search:" placeholder="Movie name" [(ngModel)]="keyword"></ion-input>
  <ion-button (click)="getSearch()">Search</ion-button>

  <!-- favourites button -->
  <ion-button fill="clear" (click)="openFavourites()">
    <ion-icon slot="icon-only" name="heart" size="large" color="primary"></ion-icon>
  </ion-button>

  <!-- dynamic heading -->
  <h4>{{heading}}</h4>

  <!-- creates card for each movie in the displayedMovies array -->
  <ion-card *ngFor="let movie of displayedMovies">
    <!-- gets movie poster for each movie; image links to movie-details page on click -->
    <ion-button fill="clear">
      <img *ngIf="movie.poster_path" src="https://image.tmdb.org/t/p/w200{{movie.poster_path}}" (click)="openMovieDetails(movie.id)"/>
    </ion-button>
    <!-- shows "No image" if none is available -->
    <ion-button fill="clear">
      <h5 *ngIf="!movie.poster_path" (click)="openMovieDetails(movie.id)"><em>No image</em></h5>
    </ion-button>
    <!-- show movie overview -->
    <ion-card-content>{{movie.overview}}</ion-card-content>
  </ion-card>

</ion-content>
