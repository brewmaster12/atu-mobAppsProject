<!-- *ngIf waits for person variable before loading page -->
<ion-header [translucent]="true" *ngIf="person">
  <ion-toolbar>
    <ion-title>{{person.name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="person">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">details</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- favourites button -->
  <ion-button fill="clear" (click)="openFavourites()">
    <ion-icon slot="icon-only" name="heart" size="large" color="primary"></ion-icon>
  </ion-button>

  <!-- home button -->
  <ion-button fill="clear" (click)="openHome()">
    <ion-icon slot="icon-only" name="home" size="large" color="primary"></ion-icon>
  </ion-button>

  <ion-card>
    <ion-card-header>
      <!-- person's image; or no "No image" if none is available -->
      <img *ngIf="person.profile_path" width="100px" src="https://image.tmdb.org/t/p/w200{{person.profile_path}}"/>
      <h5 *ngIf="!person.profile_path"><em>No image</em></h5>

      <!-- Birth and death days -->
      <ion-card-title>{{person.birthday}} - {{person.deathday}}</ion-card-title>
      <ion-card-subtitle>{{person.place_of_birth}}</ion-card-subtitle>
      <ion-card-subtitle>Also known as:
        <ul>
          <!-- generates list item for each name -->
          <li *ngFor="let name of person.also_known_as">{{name}}</li>
        </ul>
      </ion-card-subtitle>
    </ion-card-header>

    <!-- peron's biography -->
    <ion-card-content>{{person.biography}}</ion-card-content>
  </ion-card>

  <h4>Other movies:</h4>
  <ion-list>
    <!-- generates list item for each movie in person's cast and crew credits -->
    <ion-item *ngFor="let movie of credits.cast">
      <ion-label>{{movie.title}}</ion-label>
    </ion-item>
    <ion-item *ngFor="let movie of credits.crew">
      <ion-label>{{movie.title}}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
