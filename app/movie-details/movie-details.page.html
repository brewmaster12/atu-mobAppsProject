<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Movie details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="movie">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">movie-details</ion-title>
    </ion-toolbar>
  </ion-header>

  <h4>Cast</h4>
  <ion-card *ngFor="let cast of movie.cast">
    <ion-card-header>
      <img *ngIf="cast.profile_path" width="100px" src="https://image.tmdb.org/t/p/w200{{cast.profile_path}}" (click)="openDetails()"/>
      <h5 *ngIf="!cast.profile_path" (click)="openDetails()"><em>No image</em></h5>
      
      <ion-card-title>{{cast.character}}</ion-card-title>
      <ion-card-subtitle>{{cast.name}}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content></ion-card-content>
  </ion-card>

  <h4>Crew</h4>
  <ion-card *ngFor="let crew of movie.crew">
    <ion-card-header>
      <img *ngIf="crew.profile_path" width="100px" src="https://image.tmdb.org/t/p/w200{{crew.profile_path}}" (click)="openDetails()"/>
      <h5 *ngIf="!crew.profile_path" (click)="openDetails()"><em>No image</em></h5>

      <ion-card-title>{{crew.department}}</ion-card-title>
      <ion-card-subtitle>{{crew.name}}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content></ion-card-content>
  </ion-card>
  


</ion-content>
